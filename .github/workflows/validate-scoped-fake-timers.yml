name: Validate scoped fake timer exemptions
on:
  push:
    branches: [validation/scoped-fake-timers-20261120]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 2859a2faf3bc659da8b870fa80a852a89526d327
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/landmines
          ref: 2859a2faf3bc659da8b870fa80a852a89526d327
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install locked dependencies and check exact source
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --version
          bun --version
          bun install --frozen-lockfile
      - name: Check formatting
        working-directory: source
        run: |
          if ! bun run format:check; then
            bun run format packages/landmines/src/rules/no-fixed-sleep.ts packages/landmines/src/rules/no-fixed-sleep.test.ts .changeset/scope-fake-timer-exemptions.md
            git diff
            exit 1
          fi
      - name: Reproduce nested step regressions in the earlier candidate
        working-directory: source
        shell: bash
        run: |
          git show 153953efa2bfeedeb706ea865dfe33e29164b185:packages/landmines/src/rules/no-fixed-sleep.ts > packages/landmines/src/rules/no-fixed-sleep.ts
          trap 'git restore -- packages/landmines/src/rules/no-fixed-sleep.ts' EXIT
          set +e
          bun run --cwd packages/landmines test src/rules/no-fixed-sleep.test.ts --reporter=json --outputFile="$RUNNER_TEMP/step-regression.json"
          status=$?
          set -e
          git restore -- packages/landmines/src/rules/no-fixed-sleep.ts
          trap - EXIT
          test "$status" -eq 1
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/step-regression.json")); print({k:d[k] for k in ["numTotalTests","numPassedTests","numFailedTests","numPendingTests"]}); assert d["numFailedTests"] == 7 and d["numPassedTests"] == 62 and d["numPendingTests"] == 0; failed=[a for s in d["testResults"] for a in s["assertionResults"] if a["status"] == "failed"]; assert len(failed)==7 and all("test.step" in a["fullName"] for a in failed)'
      - name: Reproduce mixed timer regressions on unchanged main
        working-directory: source
        shell: bash
        run: |
          git show 79e91992952c14b0c217b403fa416024c1929afe:packages/landmines/src/rules/no-fixed-sleep.ts > packages/landmines/src/rules/no-fixed-sleep.ts
          trap 'git restore -- packages/landmines/src/rules/no-fixed-sleep.ts' EXIT
          set +e
          bun run --cwd packages/landmines test src/rules/no-fixed-sleep.test.ts --reporter=json --outputFile="$RUNNER_TEMP/mixed-timers-baseline.json"
          status=$?
          set -e
          git restore -- packages/landmines/src/rules/no-fixed-sleep.ts
          trap - EXIT
          test "$status" -eq 1
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/mixed-timers-baseline.json")); print({k:d[k] for k in ["numTotalTests","numPassedTests","numFailedTests","numPendingTests"]}); assert d["numFailedTests"] == 11 and d["numPassedTests"] == 58 and d["numPendingTests"] == 0; failed=[a for s in d["testResults"] for a in s["assertionResults"] if a["status"] == "failed"]; assert len(failed)==11 and all("mixed" in a["fullName"] or "keeps test.each" in a["fullName"] for a in failed)'
      - name: Run the fixed rule and complete repository suite
        working-directory: source
        run: |
          bun run lint
          bun run typecheck
          bun run build
          bun run test
      - name: Verify native real and fake clocks against fixed rule
        working-directory: source
        run: python3 ../validation/mixed-timers.py 1
      - name: Verify exact source remains clean
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bun run format:check
          git diff --exit-code
          git diff --check
