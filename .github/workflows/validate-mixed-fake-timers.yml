name: Reproduce mixed fake and real timers
on:
  push:
    branches: [validation/mixed-fake-timers-baseline-20261120]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/landmines
          ref: 79e91992952c14b0c217b403fa416024c1929afe
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install locked source dependencies
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = 79e91992952c14b0c217b403fa416024c1929afe
          node --version
          bun --version
          bun install --frozen-lockfile
      - name: Demonstrate native real timer wait is suppressed on main
        working-directory: source
        run: python3 ../validation/mixed-timers.py 0
      - name: Verify source remains unchanged
        working-directory: source
        run: |
          git diff --exit-code
          git diff --check
