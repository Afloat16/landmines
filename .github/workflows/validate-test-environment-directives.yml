name: Validate preserved test environment directives
on:
  push:
    branches: [validation/test-environment-directives-20261120]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 912a013b0e86ad765425314e856cdab92e33c907
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/landmines
          ref: 912a013b0e86ad765425314e856cdab92e33c907
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install locked dependencies and check exact source
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --version
          bun --version
          bun install --frozen-lockfile
      - name: Check formatting
        working-directory: source
        run: bun run format:check
      - name: Reproduce the six directive false positives on unchanged main
        working-directory: source
        shell: bash
        run: |
          git show 79e91992952c14b0c217b403fa416024c1929afe:packages/landmines/src/rules/no-comments.ts > packages/landmines/src/rules/no-comments.ts
          trap 'git restore -- packages/landmines/src/rules/no-comments.ts' EXIT
          set +e
          bun run --cwd packages/landmines test src/rules/no-comments.test.ts --reporter=json --outputFile="$RUNNER_TEMP/environment-baseline.json"
          status=$?
          set -e
          git restore -- packages/landmines/src/rules/no-comments.ts
          trap - EXIT
          test "$status" -eq 1
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/environment-baseline.json")); print({k:d[k] for k in ["numTotalTests","numPassedTests","numFailedTests","numPendingTests"]}); assert d["numFailedTests"] == 6 and d["numPendingTests"] == 0; failed=[a for s in d["testResults"] for a in s["assertionResults"] if a["status"] == "failed"]; assert len(failed)==6 and all("environment" in a["fullName"] for a in failed)'
      - name: Run the fixed rule and complete repository suite
        working-directory: source
        run: |
          bun run lint
          bun run typecheck
          bun run build
          bun run test
      - name: Verify actual Vitest environment and option selection
        working-directory: source
        run: python3 ../validation/environment-directives.py
      - name: Verify exact source remains clean
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bun run format:check
          git diff --exit-code
          git diff --check
