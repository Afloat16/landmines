name: Validate current-main Landmines integrations
on:
  push:
    branches: [validation/landmines-current-main-20261127]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-landmines-current-main
  cancel-in-progress: true
jobs:
  verify:
    name: Verify PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 30
            sha: b405badf10038b236bcdd25f44e74790fa71dc59
          - pr: 36
            sha: a6d31e4cb5074edc5ad169be086537d8175753a0
    steps:
      - name: Check out the immutable integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
          git diff --check b7eff4482cfb8cc38149777559326b85aaeccadd HEAD
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.3
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Check types
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Complete package test suite
        run: bun run test
      - name: Confirm tracked source is unchanged
        run: git diff --exit-code
